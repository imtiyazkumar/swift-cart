services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yember}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yember"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      FINANCE_BANK_KEYS: ${FINANCE_BANK_KEYS:-}
      FINANCE_BANK_ACTIVE_KEY: ${FINANCE_BANK_ACTIVE_KEY:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      TEXTBEE_DELIVERY_ENABLED: ${TEXTBEE_DELIVERY_ENABLED:-false}
      TEXTBEE_API_KEY: ${TEXTBEE_API_KEY:-}
      TEXTBEE_DEVICE_ID: ${TEXTBEE_DEVICE_ID:-}
      TEXTBEE_BASE_URL: ${TEXTBEE_BASE_URL:-https://api.textbee.dev/api/v1}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_DSN: ${POSTGRES_DSN_DOCKER:?Set POSTGRES_DSN_DOCKER in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DOCUMENT_LOCAL_DIR: /data/documents
      DELIVERY_FEE_PAISE: ${DELIVERY_FEE_PAISE:-0}
      RESTAURANT_COMMISSION_BPS: ${RESTAURANT_COMMISSION_BPS:-0}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    volumes:
      - documents-data:/data/documents
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  documents-data:
