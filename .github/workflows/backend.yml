name: Backend validation
on: [push, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: isolated-test-password
                ports: ['5432:5432']
                options: >-
                    --health-cmd pg_isready --health-interval 5s
                    --health-timeout 5s --health-retries 10
        env:
            POSTGRES_DSN: postgres://postgres:isolated-test-password@localhost:5432/postgres?sslmode=disable
            YEMBER_INTEGRATION: '1'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true
            - run: go test ./... -count=1
            - run: go vet ./...
            - run: go build ./cmd/api
            - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
